name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BUILD_PACKAGES: "-p eventide-server -p eventide-trap -p eventide-license"

jobs:
  linux-x86_64:
    name: Linux x86_64 (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release ${{ env.BUILD_PACKAGES }}

      - name: Stage package
        env:
          PACKAGE_NAME: eventide-linux-x86_64
          PACKAGE_LABEL: Linux x86_64 (glibc / Ubuntu runner)
          BIN_DIR: target/release
        run: bash .github/scripts/package-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventide-linux-x86_64
          path: dist/eventide-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # GitHub 无官方麒麟 runner：在社区 Kylin V10 SP3 容器内编译，
  # 以贴近银河麒麟高级服务器操作系统 V10 SP3 的 glibc / 依赖环境。
  # 参考：https://github.com/lvpenglive/axleops/blob/main/.github/workflows/build-linux.yml
  kylin-v10-sp3-x86_64:
    name: Kylin V10 SP3 x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Kylin V10 SP3 container
        run: |
          set -euo pipefail
          docker pull hxsoong/kylin:v10-sp3
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CARGO_HOME=/workspace/.cargo-kylin \
            -e RUSTUP_HOME=/workspace/.rustup-kylin \
            hxsoong/kylin:v10-sp3 \
            bash -lc '
              set -euo pipefail
              echo "=== host productinfo ==="
              cat /etc/.productinfo 2>/dev/null || true
              cat /etc/os-release 2>/dev/null || true

              yum install -y \
                gcc gcc-c++ make \
                openssl-devel pkgconfig perl \
                curl ca-certificates tar gzip git \
                || yum install -y gcc gcc-c++ make openssl-devel pkgconfig perl curl tar gzip

              export PATH="$CARGO_HOME/bin:$PATH"
              if ! command -v rustc >/dev/null 2>&1; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --default-toolchain stable --profile minimal
              fi
              # shellcheck source=/dev/null
              source "$CARGO_HOME/env"
              rustc -vV

              cargo build --release \
                -p eventide-server \
                -p eventide-trap \
                -p eventide-license
            '

      - name: Stage package
        env:
          PACKAGE_NAME: eventide-kylin-v10-sp3-x86_64
          PACKAGE_LABEL: Kylin V10 SP3 x86_64 (built in hxsoong/kylin:v10-sp3)
          BIN_DIR: target/release
        run: bash .github/scripts/package-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventide-kylin-v10-sp3-x86_64
          path: dist/eventide-kylin-v10-sp3-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --release ${{ env.BUILD_PACKAGES }}

      - name: Stage package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'eventide-windows-x86_64'
          $out = "dist\$name"
          $bin = 'target\release'
          New-Item -ItemType Directory -Force -Path "$out\static", "$out\keys" | Out-Null

          Copy-Item "$bin\eventide.exe" $out
          Copy-Item "$bin\eventide-trap.exe" $out
          Copy-Item "$bin\eventide-license.exe" $out
          Copy-Item -Recurse static\* "$out\static\"
          Copy-Item eventide.toml.example $out
          Copy-Item eventide-trap.toml.example $out
          Copy-Item keys\license_public.pem "$out\keys\"
          Copy-Item keys\README.md "$out\keys\"

          @(
            'Eventide package: Windows x86_64 (MSVC)'
            ''
            'Binaries:'
            '  eventide.exe'
            '  eventide-trap.exe'
            '  eventide-license.exe'
            ''
            'Quick start:'
            '  1. copy eventide.toml.example eventide.toml'
            '  2. copy eventide-trap.toml.example eventide-trap.toml'
            '  3. Edit MySQL / Redis / Kafka settings'
            '  4. .\eventide.exe eventide.toml'
            '  5. .\eventide-trap.exe eventide-trap.toml'
          ) | Set-Content -Encoding utf8 "$out\README.txt"

          Compress-Archive -Path $out -DestinationPath "dist\$name.zip" -Force
          Get-Item "dist\$name.zip" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventide-windows-x86_64
          path: dist/eventide-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [linux-x86_64, kylin-v10-sp3-x86_64, windows-x86_64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: eventide-*
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
