# Eventide Trap service — SNMP Trap → Kafka
# Copy to eventide-trap.toml and fill in secrets.
# Run: cargo run -p eventide-trap -- eventide-trap.toml

listen_http = "0.0.0.0:8081"
listen_udp = "0.0.0.0:1162"

kafka_brokers = "127.0.0.1:9092"
kafka_topic = "eventide.snmptrap"
# Hash produce across N partitions (peer IP key). Align with topic + Ingress options.partitions.
kafka_partitions = 6
# Legacy fixed partition when kafka_partitions = 1
kafka_partition = 0

community = ""
default_severity = "warning"
recent_limit = 50

# SNMPv3 USM users (empty = reject v3; v1/v2c still work)
# [[snmpv3_users]]
# user = "trapuser"
# auth_protocol = "sha256"   # none | md5 | sha | sha256
# auth_password = "authpass"
# priv_protocol = "aes128"   # none | des | aes128
# priv_password = "privpass"
# # engine_id = "80001f8880…"  # optional hex filter; empty = any

# Shared Eventide MySQL (trap_policies + trap_mibs)
mysql_url = "mysql://eventide:eventide@127.0.0.1:3306/eventide"

# RustFS / S3 — Trap 热加载 MIB 正文（与 eventide.toml [trap] 同一 bucket）
s3_endpoint = "http://127.0.0.1:9000"
s3_access_key = "CHANGE_ME"
s3_secret_key = "CHANGE_ME"
s3_bucket = "eventide-mibs"
s3_region = "us-east-1"

mib_cache_dir = "data/mib-cache"
policy_reload_secs = 10

# Same Redis as eventide-server — policy snapshot + pub/sub (preferred over MySQL poll)
# Key: eventide:trap:policies:snapshot  Channel: eventide:trap:policies:changed
redis_url = "redis://127.0.0.1:6379/"

# Legacy local paths — one-time migration when DB tables are empty
# (MIB/policy CRUD is on eventide-server; Trap only reloads)
mib_dir = "data/mibs"
policies_path = "data/trap-policies.json"
