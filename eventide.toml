listen = "0.0.0.0:8080"
mysql_url = "mysql://root:886363@120.26.67.180:3306/eventide"
redis_url = "redis://123.207.158.181:6379/"
static_dir = "static"
scheduler_tick_seconds = 5

[auth]
username = "admin"
password = "admin123"
jwt_secret = "eventide-dev-secret-change-me"
token_ttl_hours = 24

[storm]
throttle_enabled = true
min_interval_seconds = 60
max_per_window = 20
window_seconds = 60
throttle_key = "fingerprint"
aggregate_enabled = true
aggregate_window_seconds = 30
group_by = "alertname"
aggregate_mode = "head+summary"
aggregate_sample_labels = "ip,instance,alertIp"
aggregate_sample_limit = 10
ingress_max_inflight = 100
degrade_skip_notify = false
degrade_notify_per_sec = 50

[cluster]
enabled = true
leader_key = "eventide:cluster:leader"
lease_seconds = 15
# Kafka Ingress 已改用 consumer group；以下两项保留兼容，运行时忽略
ingress_partition_lease_seconds = 15
ingress_max_claim = 0

# Trap：运行态反代 + MIB/策略 CRUD（RustFS）
[trap]
api_url = "http://127.0.0.1:8081"
# Must match eventide-trap.toml api_token (injected as Bearer on /trap-api)
api_token = "eventide-trap-shared-token"
s3_endpoint = "http://120.26.67.180:9000"
s3_access_key = "admin"
s3_secret_key = "admin123"
s3_bucket = "eventide-mibs"
s3_region = "us-east-1"
mib_cache_dir = "data/mib-cache"
