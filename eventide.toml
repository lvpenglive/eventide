listen = "0.0.0.0:8080"
mysql_url = "mysql://eventide:eventide@127.0.0.1:3306/eventide"
redis_url = "redis://127.0.0.1:6379/"
static_dir = "static"
scheduler_tick_seconds = 5

[auth]
username = "admin"
password = "admin123"
jwt_secret = "eventide-dev-secret-change-me"
token_ttl_hours = 24

# Alert-storm (README §13.1) — throttle/aggregate state lives in Redis
[storm]
throttle_enabled = true
min_interval_seconds = 60
max_per_window = 20
window_seconds = 60
# fingerprint | labels:alertname,ip
throttle_key = "fingerprint"

# P1: time-window aggregation (default off; set true to enable)
aggregate_enabled = true
aggregate_window_seconds = 30
group_by = "alertname"
aggregate_mode = "head+summary"
aggregate_sample_labels = "ip,instance,alertIp"
aggregate_sample_limit = 10

# P2: ingress backpressure (per-process)
ingress_max_inflight = 100
# when true: under load skip notify (still persist); triggers at ~80% inflight or notify rate
degrade_skip_notify = false
degrade_notify_per_sec = 50

# Multi-instance: only the Redis lease holder runs scheduler / Kafka poll / aggregate flush.
# HTTP API and webhook ingress still run on every instance. Set enabled = false for single-node.
[cluster]
enabled = true
leader_key = "eventide:cluster:leader"
lease_seconds = 15

# Optional bootstrap for alert history ES (console「系统设置」也可改地址，保存即生效)
