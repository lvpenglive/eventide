<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventide</title>
  <script>
    (function () {
      try {
        var k = "eventide_theme";
        var pref = localStorage.getItem(k) || "system";
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = pref === "light" || pref === "dark" ? pref : dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-theme-pref", pref === "light" || pref === "dark" ? pref : "system");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-theme-pref", "system");
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/app.css?v=68" />
</head>
<body>
  <!-- Login -->
  <div id="view-login">
    <div class="login-theme theme-switch" id="login-theme"></div>
    <div class="login-stage">
      <div class="login-brand">
        <div class="mark">Eventide</div>
        <p>多数据源告警引擎 · 评估 · 去重 · 通知</p>
      </div>
      <form class="login-panel" id="login-form" method="post" action="/" autocomplete="on">
        <h2>登录控制台</h2>
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" required value="admin" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" id="login-toggle-pw" aria-pressed="false" aria-label="显示密码" title="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" hidden>
                <path d="M2 12s3.5-7 10-7c2.1 0 3.9.6 5.4 1.5"/>
                <path d="M22 12s-3.5 7-10 7c-2.1 0-3.9-.6-5.4-1.5"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                <path d="M3 3l18 18"/>
                <path d="M14.1 9.9 9.9 14.1"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="login-error" id="login-error"></div>
        <button class="primary" type="submit" style="width:100%">进入系统</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="view-app">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand">Event<span>ide</span></div>
        <button type="button" class="sidebar-toggle" id="btn-sidebar" title="收起 / 展开侧栏" aria-label="收起或展开侧栏">
          <span class="chev">‹</span>
        </button>
      </div>
      <nav class="nav-scroll" aria-label="主导航">
        <button class="nav-item active" data-page="overview" title="总览"><span class="ico">◈</span><span class="label">总览</span></button>

        <div class="nav-group open" data-group="ops">
          <button type="button" class="nav-group-btn" data-group-toggle="ops" title="告警运营">
            <span class="ico">⚠</span><span class="label">告警运营</span><span class="caret">▾</span>
          </button>
          <div class="nav-sub">
            <button class="nav-item" data-page="alerts" title="告警事件"><span class="ico">●</span><span class="label">告警事件</span></button>
            <button class="nav-item" data-page="silences" title="静默策略"><span class="ico">◐</span><span class="label">静默策略</span></button>
            <button class="nav-item" data-page="maintenance" title="维护窗"><span class="ico">▣</span><span class="label">维护窗</span></button>
          </div>
        </div>

        <div class="nav-group open" data-group="config">
          <button type="button" class="nav-group-btn" data-group-toggle="config" title="接入配置">
            <span class="ico">▣</span><span class="label">接入配置</span><span class="caret">▾</span>
          </button>
          <div class="nav-sub">
            <button class="nav-item" data-page="datasources" title="数据源"><span class="ico">◎</span><span class="label">数据源</span></button>
            <button class="nav-item" data-page="rules" title="告警规则"><span class="ico">▦</span><span class="label">告警规则</span></button>
            <button class="nav-item" data-page="ingress" title="告警接入"><span class="ico">⇢</span><span class="label">告警接入</span></button>
            <button class="nav-item" data-page="trap" title="SNMP Trap"><span class="ico">⌁</span><span class="label">SNMP Trap</span></button>
            <button class="nav-item" data-page="mib" title="MIB 库"><span class="ico">☰</span><span class="label">MIB 库</span></button>
            <button class="nav-item" data-page="policies" title="Trap 策略"><span class="ico">▤</span><span class="label">Trap 策略</span></button>
          </div>
        </div>

        <div class="nav-group open" data-group="notify">
          <button type="button" class="nav-group-btn" data-group-toggle="notify" title="通知丰富">
            <span class="ico">✦</span><span class="label">通知丰富</span><span class="caret">▾</span>
          </button>
          <div class="nav-sub">
            <button class="nav-item" data-page="channels" title="通知渠道"><span class="ico">☍</span><span class="label">通知渠道</span></button>
            <button class="nav-item" data-page="notifies" title="通知日志"><span class="ico">▤</span><span class="label">通知日志</span></button>
            <button class="nav-item" data-page="enrich" title="告警丰富"><span class="ico">✧</span><span class="label">告警丰富</span></button>
          </div>
        </div>

        <div class="nav-group open" data-group="system">
          <button type="button" class="nav-group-btn" data-group-toggle="system" title="系统管理">
            <span class="ico">⚙</span><span class="label">系统管理</span><span class="caret">▾</span>
          </button>
          <div class="nav-sub">
            <button class="nav-item" data-page="users" title="用户管理"><span class="ico">◎</span><span class="label">用户管理</span></button>
            <button class="nav-item" data-page="roles" title="权限管理"><span class="ico">▣</span><span class="label">权限管理</span></button>
            <button class="nav-item" data-page="departments" title="部门管理"><span class="ico">▦</span><span class="label">部门管理</span></button>
            <button class="nav-item" data-page="settings" title="系统设置"><span class="ico">⚙</span><span class="label">系统设置</span></button>
            <button class="nav-item" data-page="audit" title="操作审计"><span class="ico">☰</span><span class="label">操作审计</span></button>
          </div>
        </div>

        <div class="nav-group open" data-group="tools">
          <button type="button" class="nav-group-btn" data-group-toggle="tools" title="工具">
            <span class="ico">⚒</span><span class="label">工具</span><span class="caret">▾</span>
          </button>
          <div class="nav-sub">
            <button class="nav-item" data-page="kafka" title="Kafka"><span class="ico">▤</span><span class="label">Kafka</span></button>
          </div>
        </div>
      </nav>
      <div class="user-box">
        <div class="user-meta">
          <div class="user-avatar" id="user-avatar" title="">A</div>
          <strong id="user-name">—</strong>
        </div>
        <div id="sidebar-theme" class="theme-switch compact" style="width:100%;margin-bottom:10px"></div>
        <button class="ghost" id="btn-change-pw" type="button" style="width:100%;margin-bottom:8px">修改密码</button>
        <button class="ghost" id="btn-logout">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">总览</h1>
          <p class="sub" id="page-sub">系统运行状态与近期告警</p>
        </div>
        <div class="toolbar">
          <div id="page-actions"></div>
        </div>
      </div>
      <div id="license-banner" class="license-banner" hidden></div>
      <div id="password-banner" class="license-banner" hidden></div>
      <div id="page-root"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" id="modal-body"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="/assets/app.js?v=96"></script>
</body>
</html>
